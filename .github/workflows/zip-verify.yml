# TEMPORARY. Installs the built legacy archive on every KiCad the package could
# plausibly meet and runs a real stitch on each, to find out where the
# kicad_version_max cap actually belongs. Delete once the answer is recorded.
#
# Stock Ubuntu covers 6 and 7; the KiCad PPAs cover 8, 9 and 10. KiCad 6 also
# brings shapely 1.8 along (jammy), and the rest bring 2.x, so both shapely
# generations get exercised.

name: zip-verify (temporary)

on: [push, workflow_dispatch]

jobs:
  zip:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kicad: "6"
            os: ubuntu-22.04
            ppa: ""
          - kicad: "7"
            os: ubuntu-24.04
            ppa: ""
          - kicad: "8"
            os: ubuntu-24.04
            ppa: "ppa:kicad/kicad-8.0-releases"
          - kicad: "9"
            os: ubuntu-24.04
            ppa: "ppa:kicad/kicad-9.0-releases"
          - kicad: "10"
            os: ubuntu-24.04
            ppa: "ppa:kicad/kicad-10.0-releases"
    name: KiCad ${{ matrix.kicad }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad ${{ matrix.kicad }}
        run: |
          set -x
          if [ -n "${{ matrix.ppa }}" ]; then
            sudo add-apt-repository -y "${{ matrix.ppa }}"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kicad python3-wxgtk4.0 python3-shapely xvfb
          python3 -c "import pcbnew; print('pcbnew', pcbnew.GetBuildVersion())"

      - name: Build the legacy archive
        run: python3 build.py --legacy

      - name: Install the archive and stitch a board
        run: |
          zip=$(ls dist/via-stitching-legacy-*.zip)
          xvfb-run -a python3 tests/legacy/zip_smoke.py "$zip"

      - name: Run the legacy suites against this KiCad
        continue-on-error: true
        run: |
          for t in tests/legacy/test_*.py; do
            echo "::group::$t"
            xvfb-run -a python3 "$t" || echo "FAILED $t"
            echo "::endgroup::"
          done
