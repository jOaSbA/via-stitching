# TEMPORARY. Answers one question: does the IPC build, which pins a kipy built
# against the KiCad 10 API, actually work against a running KiCad 9? If it
# does, KiCad 9 users should get the IPC package instead of the SWIG one.
#
# KiCad 10 runs alongside as the control: if the 9 job fails and the 10 job
# passes, the failure is the version and not this harness.

name: ipc-live (temporary)

on: [push, workflow_dispatch]

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kicad: "9"
            ppa: "ppa:kicad/kicad-9.0-releases"
            config: "9.0"
          - kicad: "10"
            ppa: "ppa:kicad/kicad-10.0-releases"
            config: "10.0"
    name: live KiCad ${{ matrix.kicad }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad ${{ matrix.kicad }} and the plugin's dependencies
        run: |
          sudo add-apt-repository -y "${{ matrix.ppa }}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kicad python3-wxgtk4.0 python3-shapely xvfb
          pip install --break-system-packages -r plugins/requirements.txt
          python3 -c "import pcbnew; print('pcbnew', pcbnew.GetBuildVersion())"

      - name: Build a board with two poured GND zones
        run: |
          python3 - <<'EOF'
          import pcbnew
          mm = 1_000_000
          board = pcbnew.BOARD()
          board.SetCopperLayerCount(2)
          gnd = pcbnew.NETINFO_ITEM(board, "GND")
          board.Add(gnd)
          for layer in (pcbnew.F_Cu, pcbnew.B_Cu):
              zone = pcbnew.ZONE(board)
              zone.SetNet(gnd)
              zone.SetLayer(layer)
              board.Add(zone)
              polyset = pcbnew.SHAPE_POLY_SET()
              chain = pcbnew.SHAPE_LINE_CHAIN()
              for (x, y) in [(0, 0), (20 * mm, 0), (20 * mm, 20 * mm), (0, 20 * mm)]:
                  chain.Append(pcbnew.VECTOR2I(int(x), int(y)))
              chain.SetClosed(True)
              polyset.AddOutline(chain)
              zone.SetFilledPolysList(layer, polyset)
          pcbnew.SaveBoard("/tmp/live.kicad_pcb", board)
          print("saved /tmp/live.kicad_pcb")
          EOF

      - name: Enable the API server
        run: |
          dir="$HOME/.config/kicad/${{ matrix.config }}"
          mkdir -p "$dir"
          # Pre-seed the library tables so KiCad does not stop on its
          # first-run "configure global libraries" dialog.
          printf '(fp_lib_table\n)\n' > "$dir/fp-lib-table"
          printf '(sym_lib_table\n)\n' > "$dir/sym-lib-table"
          printf '{"api": {"enable_server": true}}\n' > "$dir/kicad_common.json"
          cat "$dir/kicad_common.json"

      - name: Launch pcbnew with the board
        run: |
          mkdir -p /tmp/kicad
          nohup xvfb-run -a pcbnew /tmp/live.kicad_pcb > /tmp/pcbnew.log 2>&1 &
          for i in $(seq 1 60); do
            if [ -S /tmp/kicad/api.sock ]; then echo "socket up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "no API socket after 60s" >&2
          ls -la /tmp/kicad || true
          cat /tmp/pcbnew.log || true
          exit 1

      - name: Stitch the live board over IPC
        run: python3 tests/ipc/live_smoke.py

      - name: pcbnew output
        if: always()
        run: cat /tmp/pcbnew.log || true
