name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4

      - name: Validate tag against metadata.json
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          metadata_version="$(jq -r '.versions[-1].version' metadata.json)"
          if [[ "${version}" != "${metadata_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match metadata.json's latest version ${metadata_version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive=via-stitching-${version}.zip" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wxPython runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnotify4 libsdl2-2.0-0 libsm6

      - name: Install plugin dependencies
        run: |
          pip install wxPython==4.2.2 \
            -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/
          pip install -r plugins/requirements.txt

      - name: Run tests
        run: |
          for t in tests/ipc/test_*.py; do echo "== $t"; xvfb-run -a python "$t"; done

      - name: Build PCM package
        run: python3 build.py

      - name: Verify metadata.json is up to date
        run: |
          if ! git diff --exit-code metadata.json; then
            echo "metadata.json is stale -- run 'python build.py' locally and commit the result before tagging." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${{ steps.version.outputs.archive }}" \
            --verify-tag \
            --title "Via Stitching ${{ steps.version.outputs.version }}" \
            --generate-notes
