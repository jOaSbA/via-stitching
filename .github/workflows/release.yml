# One tag, one release, both builds.
#
# The IPC package and the SWIG package are one PCM package with two runtimes,
# so they ship together: the tag names the IPC version, the release carries
# both archives, and metadata.json points both download_urls at it.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4

      - name: Validate tag against metadata.json
        id: version
        run: |
          python3 tools/check_release.py "${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wxPython runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnotify4 libsdl2-2.0-0 libsm6

      - name: Install plugin dependencies
        run: |
          pip install wxPython==4.2.2 \
            -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/
          pip install -r plugins/requirements.txt

      # The SWIG suites need a real pcbnew, so they run in legacy-matrix.yml,
      # which this same tag triggers.
      - name: Run the IPC tests
        run: |
          for t in tests/ipc/test_*.py; do echo "== $t"; xvfb-run -a python "$t"; done

      - name: Build both PCM packages
        run: |
          python3 build.py
          python3 build.py --legacy

      - name: Verify metadata.json is up to date
        run: |
          if ! git diff --exit-code metadata.json; then
            echo "metadata.json is stale -- run 'python build.py' and 'python build.py --legacy' locally and commit the result before tagging." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${{ steps.version.outputs.ipc_archive }}" \
            "dist/${{ steps.version.outputs.swig_archive }}" \
            --verify-tag \
            --title "Via Stitching ${GITHUB_REF_NAME}" \
            --generate-notes
