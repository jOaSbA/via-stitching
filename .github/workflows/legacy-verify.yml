# TEMPORARY. One-off verification that the legacy SWIG backend works on the
# KiCad versions it claims to support. Everything so far was checked against a
# local KiCad 6.0.11 only, and Ubuntu happens to ship the other two ends of the
# range: 22.04 has KiCad 6, 24.04 has KiCad 8. Delete this file once the
# results are in.

name: legacy-verify (temporary)

on: [push, workflow_dispatch]

jobs:
  legacy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # KiCad 6.x, the version verified locally
          - os: ubuntu-24.04   # KiCad 8.x, never verified
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad and the test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kicad python3-wxgtk4.0 python3-shapely xvfb

      - name: Report what we actually got
        run: |
          python3 -c "import pcbnew; print('pcbnew', pcbnew.GetBuildVersion())"
          python3 -c "import shapely, wx; print('shapely', shapely.__version__, '| wx', wx.version())"

      - name: Probe the version-specific APIs
        run: xvfb-run -a python3 tests/legacy/_api_probe.py

      - name: Run the legacy suites
        run: |
          failed=""
          for t in tests/legacy/test_*.py; do
            echo "::group::$t"
            if xvfb-run -a python3 "$t"; then echo "PASS $t"; else failed="$failed $t"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
